name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_simulator_tests:
        description: Run the full iOS 27 Simulator screenshot and XCUITest suite
        type: boolean
        default: false
      record_references:
        description: Re-record screenshot references and the accessibility baseline, and upload them as artifacts
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  # A newer push or pull-request update cancels the older run; manual runs (such as re-recording references) are
  # grouped separately so they neither cancel nor get cancelled by push runs.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODEGEN_VERSION: 2.45.4
  DEMO_DIR: Examples/ClaudeUIDemo
  PROJECT: ClaudeUIDemo.xcodeproj
  SCHEME: ClaudeUIDemo
  # Screenshot references are recorded on exactly this simulator. Changing it means re-recording them.
  SIMULATOR_DEVICE: iPhone 15 Pro
  SIMULATOR_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-27-0

jobs:
  checks:
    name: Format, project sync, unit tests, API check, iOS 26 SDK build
    # Use macos-26-intel (x64) to avoid GitHub's macOS arm64 queue capacity timeouts while keeping Xcode 26.4.1.
    runs-on: macos-26-intel
    timeout-minutes: 30
    env:
      # The package supports iOS 26, so it must keep building with the iOS 26 SDK.
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check formatting
        run: |
          if ! out=$(swift format lint --strict --recursive --parallel . 2>&1); then
            printf '%s\n' "$out"
            printf '%s\n' "$out" | head -n 35 | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::$line"
            done
            exit 1
          fi

      - name: Check Xcode project matches project.yml
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          (cd "$DEMO_DIR" && "$RUNNER_TEMP/xcodegen/bin/xcodegen" generate --quiet)
          if ! git diff --exit-code -- "$DEMO_DIR/$PROJECT"; then
            echo "::error::$PROJECT is out of date. Run 'xcodegen generate' in $DEMO_DIR and commit the result."
            exit 1
          fi

      - name: Unit tests
        run: |
          if ! swift test > "$RUNNER_TEMP/swift-test.log" 2>&1; then
            tail -n 120 "$RUNNER_TEMP/swift-test.log"
            grep -E '(error:|failed|✘)' "$RUNNER_TEMP/swift-test.log" | head -n 30 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi
          tail -n 40 "$RUNNER_TEMP/swift-test.log"

      - name: Build app and widget extension
        working-directory: ${{ env.DEMO_DIR }}
        run: |
          if ! xcodebuild build -project "$PROJECT" -scheme "$SCHEME" \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO > "$RUNNER_TEMP/sim-build.log" 2>&1; then
            tail -n 100 "$RUNNER_TEMP/sim-build.log"
            grep -E ': error:' "$RUNNER_TEMP/sim-build.log" | head -n 30 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi
          tail -n 30 "$RUNNER_TEMP/sim-build.log"

      - name: Compare the public API with the latest tag
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          baseline=$(git describe --tags --abbrev=0 --match '[0-9]*.[0-9]*.[0-9]*' origin/main 2>/dev/null || git describe --tags --abbrev=0 --match '[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)
          if [ -z "$baseline" ]; then
            parent_url=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.parent.clone_url // empty' 2>/dev/null || true)
            if [ -n "$parent_url" ]; then
              git fetch --quiet "$parent_url" 'refs/tags/*:refs/tags/*' 2>/dev/null || true
              baseline=$(git describe --tags --abbrev=0 --match '[0-9]*.[0-9]*.[0-9]*' origin/main 2>/dev/null || git describe --tags --abbrev=0 --match '[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)
            fi
          fi
          if [ -z "$baseline" ]; then
            echo "::notice::No release tags found to compare against; skipping public API check."
            echo "status=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Comparing against $baseline"
          set +e
          swift package diagnose-api-breaking-changes "$baseline" --products ClaudeUI --products ClaudeWidgets | tee "$RUNNER_TEMP/api-diff.txt"
          status="${PIPESTATUS[0]}"
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "baseline=$baseline" >> "$GITHUB_OUTPUT"

      - name: Require the 'breaking' label when the API changed
        if: ${{ steps.diff.outputs.status != '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "::warning::The public API differs from ${{ steps.diff.outputs.baseline }} (see the step above)."
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Push to main: recorded as a warning only."
            exit 0
          fi
          labels=$(gh pr view "${{ github.event.pull_request.number }}" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name')
          if echo "$labels" | grep -qx "breaking"; then
            echo "The pull request carries the 'breaking' label; the change is intentional. Make sure CHANGELOG.md and docs/VERSIONING.md cover it."
            exit 0
          fi
          echo "::error::This pull request changes the public API (an added, removed or renamed public symbol). Either revert the API change, or add the 'breaking' label and document the change in CHANGELOG.md (an added action also needs a note that adopters' switches will warn)."
          exit 1

  build-ipa:
    name: Build iOS IPA & Publish Release
    runs-on: macos-26-intel
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build unsigned Release app for iOS device
        working-directory: ${{ env.DEMO_DIR }}
        run: |
          if ! xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedDataIPA" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES > "$RUNNER_TEMP/ipa-build.log" 2>&1; then
            tail -n 100 "$RUNNER_TEMP/ipa-build.log"
            grep -E ': error:' "$RUNNER_TEMP/ipa-build.log" | head -n 30 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi
          tail -n 40 "$RUNNER_TEMP/ipa-build.log"

      - name: Package and ad-hoc sign IPA
        run: |
          APP_PATH="$RUNNER_TEMP/DerivedDataIPA/Build/Products/Release-iphoneos/ClaudeUIDemo.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::Built app bundle not found at $APP_PATH"
            ls -la "$RUNNER_TEMP/DerivedDataIPA/Build/Products" || true
            exit 1
          fi

          STAGE_DIR="$RUNNER_TEMP/ipa-stage"
          IPA_DIR="$RUNNER_TEMP/ipa-out"
          rm -rf "$STAGE_DIR" "$IPA_DIR"
          mkdir -p "$STAGE_DIR/Payload" "$IPA_DIR"

          ditto "$APP_PATH" "$STAGE_DIR/Payload/ClaudeUIDemo.app"
          APP_BUNDLE="$STAGE_DIR/Payload/ClaudeUIDemo.app"

          # Allow local/LAN HTTP endpoints (e.g. Ollama, LM Studio, vLLM) and hardware permissions on device.
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$APP_BUNDLE/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Set :NSAppTransportSecurity:NSAllowsLocalNetworking true" "$APP_BUNDLE/Info.plist" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" "$APP_BUNDLE/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'Take photos to attach and analyze in chat conversations.'" "$APP_BUNDLE/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'Record voice input for live speech-to-text dictation.'" "$APP_BUNDLE/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'Attach photos from your library to chat conversations.'" "$APP_BUNDLE/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSSpeechRecognitionUsageDescription string 'Transcribe spoken audio into chat messages on your device.'" "$APP_BUNDLE/Info.plist" 2>/dev/null || true

          find "$APP_BUNDLE" -name "_CodeSignature" -type d -prune -exec rm -rf {} +

          if [ -d "$APP_BUNDLE/Frameworks" ]; then
            find "$APP_BUNDLE/Frameworks" -maxdepth 1 \( -name "*.dylib" -o -name "*.framework" \) -print0 | while IFS= read -r -d '' item; do
              /usr/bin/codesign --force --sign - --timestamp=none "$item"
            done
          fi

          if [ -d "$APP_BUNDLE/PlugIns" ]; then
            find "$APP_BUNDLE/PlugIns" -maxdepth 1 -name "*.appex" -print0 | while IFS= read -r -d '' appex; do
              /usr/bin/codesign --force --sign - --timestamp=none "$appex"
            done
          fi

          /usr/bin/codesign --force --sign - --timestamp=none "$APP_BUNDLE"
          /usr/bin/codesign --verify --deep --strict "$APP_BUNDLE"

          (cd "$STAGE_DIR" && zip -qry "$IPA_DIR/ClaudeUIDemo.ipa" Payload)
          (cd "$IPA_DIR" && shasum -a 256 ClaudeUIDemo.ipa > ClaudeUIDemo.ipa.sha256)
          ls -lh "$IPA_DIR"

      - name: Publish IPA to GitHub Releases
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          retry() {
            local n=1
            local max=6
            local out=""
            until out=$("$@" 2>&1); do
              echo "$out" >&2
              if [ "$n" -ge "$max" ]; then
                flat_out=$(printf '%s' "$out" | tr '\n' ' ')
                echo "::error::Command '$1 $2' failed after $max attempts: $flat_out"
                return 1
              fi
              echo "Attempt $n/$max failed; flushing DNS cache and retrying in 5s..." >&2
              dscacheutil -flushcache 2>/dev/null || true
              n=$((n + 1))
              sleep 5
            done
            printf '%s\n' "$out"
          }

          # Ensure the parallel checks job succeeded before publishing the release.
          checks_ok="false"
          for attempt in $(seq 1 60); do
            checks_state=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" \
              --jq '.jobs[] | select(.name | startswith("Format, project sync")) | "\(.status):\(.conclusion // "")"' \
              2>/dev/null || echo "transient:retry")
            case "$checks_state" in
              completed:success)
                echo "Checks job passed."
                checks_ok="true"
                break
                ;;
              completed:*)
                echo "::error::Checks job did not succeed ($checks_state); aborting IPA release upload."
                exit 1
                ;;
              *)
                echo "[$attempt/60] Waiting for checks job ($checks_state)..."
                dscacheutil -flushcache 2>/dev/null || true
                sleep 10
                ;;
            esac
          done

          if [ "$checks_ok" != "true" ]; then
            echo "::error::Timed out waiting for checks job to complete."
            exit 1
          fi

          IPA_DIR="$RUNNER_TEMP/ipa-out"
          TAG="ipa-latest"
          SHORT_SHA=$(printf '%.7s' "$TARGET_SHA")
          SHA256=$(awk '{print $1}' "$IPA_DIR/ClaudeUIDemo.ipa.sha256")
          SIZE=$(du -h "$IPA_DIR/ClaudeUIDemo.ipa" | awk '{print $1}')
          TITLE="Claude UI Demo IPA ($SHORT_SHA)"

          {
            echo "## Claude UI Demo — iOS IPA Build"
            echo ""
            echo "- **Branch:** \`$SOURCE_BRANCH\`"
            echo "- **Commit:** \`$TARGET_SHA\`"
            echo "- **Bundle ID:** \`org.community.claudeui.demo\` (iOS 26.0+, arm64)"
            echo "- **Arquivo:** \`ClaudeUIDemo.ipa\` ($SIZE)"
            echo "- **SHA-256:** \`$SHA256\`"
            echo ""
            echo "### Instalação (Sideload)"
            echo "IPA com assinatura *ad-hoc* pronto para instalar via **AltStore**, **SideStore**, **Sideloadly**, **Feather**, **ESign**, **TrollStore** ou **LiveContainer**."
            echo ""
            echo "Inclui suporte completo a **BYOK (OpenAI-Compatible API)** em **Settings → API Provider**."
          } > "$RUNNER_TEMP/release-notes.md"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            retry gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" \
              -f sha="$TARGET_SHA" -F force=true >/dev/null
            retry gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" --notes-file "$RUNNER_TEMP/release-notes.md" --latest
            retry gh release upload "$TAG" \
              "$IPA_DIR/ClaudeUIDemo.ipa" \
              "$IPA_DIR/ClaudeUIDemo.ipa.sha256" \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            retry gh release create "$TAG" \
              "$IPA_DIR/ClaudeUIDemo.ipa" \
              "$IPA_DIR/ClaudeUIDemo.ipa.sha256" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$TARGET_SHA" \
              --title "$TITLE" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --latest
          fi

          echo "::notice::Published ClaudeUIDemo.ipa ($SIZE) to release '$TAG'."

  simulator-tests:
    name: Screenshot and UI tests (iOS 27)
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.run_simulator_tests || inputs.record_references) }}
    needs: checks
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    defaults:
      run:
        working-directory: ${{ env.DEMO_DIR }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create simulator
        run: |
          UDID=$(xcrun simctl create "CI $SIMULATOR_DEVICE" "$SIMULATOR_DEVICE" "$SIMULATOR_RUNTIME")
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"

      - name: Build for testing
        run: |
          xcodebuild build-for-testing -project "$PROJECT" -scheme "$SCHEME" \
            -destination "id=$SIMULATOR_UDID" -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO | tail -n 50
          exit "${PIPESTATUS[0]}"

      - name: Screenshot tests
        env:
          TEST_RUNNER_SNAPSHOT_TESTING_RECORD: ${{ inputs.record_references && 'all' || 'never' }}
        run: |
          set +e
          xcodebuild test-without-building -project "$PROJECT" -scheme "$SCHEME" \
            -destination "id=$SIMULATOR_UDID" -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -only-testing:ClaudeUISnapshotTests -resultBundlePath "$RUNNER_TEMP/SnapshotTests.xcresult" \
            2>&1 | grep --line-buffered -v "IDELaunchParametersSnapshot" \
            | grep --line-buffered -E "^(Test (Suite|Case)|[[:space:]]*Executed|.*error:|===|\*\*)"
          status="${PIPESTATUS[0]}"
          set -e
          # Recording always reports failures; the recorded images are the output.
          [ "${{ inputs.record_references }}" = "true" ] || exit "$status"

      - name: Record accessibility audit baseline
        if: ${{ inputs.record_references }}
        env:
          TEST_RUNNER_ACCESSIBILITY_AUDIT_RECORD: "1"
        run: |
          set +e
          xcodebuild test-without-building -project "$PROJECT" -scheme "$SCHEME" \
            -destination "id=$SIMULATOR_UDID" -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -only-testing:ClaudeUIDemoUITests/AccessibilityAuditUITests \
            2>&1 | grep --line-buffered -v "IDELaunchParametersSnapshot" \
            | grep --line-buffered -E "^(Test (Suite|Case)|[[:space:]]*Executed|.*error:|===|\*\*)"
          status="${PIPESTATUS[0]}"
          set -e
          exit "$status"

      - name: UI tests and accessibility audits
        if: ${{ !inputs.record_references }}
        run: |
          set +e
          xcodebuild test-without-building -project "$PROJECT" -scheme "$SCHEME" \
            -destination "id=$SIMULATOR_UDID" -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -only-testing:ClaudeUIDemoUITests -resultBundlePath "$RUNNER_TEMP/UITests.xcresult" \
            2>&1 | grep --line-buffered -v "IDELaunchParametersSnapshot" \
            | grep --line-buffered -E "^(Test (Suite|Case)|[[:space:]]*Executed|.*error:|===|\*\*)"
          status="${PIPESTATUS[0]}"
          set -e
          exit "$status"
